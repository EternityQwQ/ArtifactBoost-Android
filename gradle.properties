org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 启用预测性返回手势（Android 13+ 的系统侧滑返回预览动画）
android.enablePredictiveBackGesture=enable
# 镜像偶发不可达时快速失败，而不是挂在那里等默认的超长超时
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
# SDK 已预装在 sdk.dir 里，不要再联网去 Google 的 SDK 仓库拉包列表
# （无外网时会卡在 RepoManagerImpl.loadSynchronously 上假死）
android.builder.sdkDownload=false
kotlin.code.style=official
